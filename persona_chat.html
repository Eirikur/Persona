<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sal</title>
<style>
  @font-face {
    font-family: 'Alegreya';
    src: url('fonts/alegreya/Alegreya-Regular.otf') format('opentype');
    font-weight: 400; font-style: normal;
  }
  @font-face {
    font-family: 'Alegreya';
    src: url('fonts/alegreya/Alegreya-Italic.otf') format('opentype');
    font-weight: 400; font-style: italic;
  }
  @font-face {
    font-family: 'Lucida Casual';
    src: url('fonts/lucida-casual.ttf') format('truetype');
    font-weight: 400; font-style: normal;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:           #1E2B35;
    --surface:      #2A3C48;
    --border:       #304454;
    --text-user:    #C4CDD5;
    --text-sal:     #D0D8DF;
    --text-dim:     #4A5A68;
    --text-muted:   #607080;
    --accent-sal:   #b8956a;
    --accent-user:  #5a7a6a;
    --state-live:   #C4CDD5;
    --font-sal:     'Alegreya', Georgia, serif;
    --font-user:    'Lucida Casual', 'Lucida Sans', sans-serif;
    --font-ui:      'Lucida Casual', 'Lucida Sans', sans-serif;
    --radius:       10px;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text-user);
    font-family: var(--font-ui);
    font-size: 15px;
    line-height: 1.6;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 760px;
    margin: 0 auto;
    padding: 0 0 0 0;
  }

  /* ── header ── */
  #header {
    padding: 18px 24px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  #header .name {
    font-family: var(--font-sal);
    font-size: 22px;
    color: var(--accent-sal);
    letter-spacing: 0.02em;
  }

  #header .subtitle {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* ── conversation ── */
  #conversation {
    flex: 1;
    overflow-y: auto;
    padding: 24px 24px 12px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .message {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-width: 88%;
  }

  .message.sal { align-self: flex-start; }
  .message.user { align-self: flex-end; }

  .message .speaker {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 0 4px;
  }

  .message.sal .speaker { color: var(--accent-sal); opacity: 0.7; }
  .message.user .speaker { color: var(--accent-user); opacity: 0.7; text-align: right; }

  .message .bubble {
    padding: 11px 16px;
    border-radius: var(--radius);
    line-height: 1.65;
  }

  .message.sal .bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    font-family: var(--font-sal);
    font-size: 26px;
    color: var(--text-sal);
    border-bottom-left-radius: 3px;
  }

  .message.user .bubble {
    background: #253540;
    border: 1px solid #304454;
    font-family: var(--font-user);
    font-size: 20px;
    font-weight: 300;
    color: var(--text-user);
    border-bottom-right-radius: 3px;
  }

  /* ── stt preview ── */
  #stt-preview {
    padding: 6px 24px 2px;
    min-height: 24px;
    font-family: var(--font-user);
    font-size: 12px;
    font-style: italic;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #stt-preview.corrected { color: var(--accent-sal); }

  /* ── input strip ── */
  #transcription {
    padding: 6px 24px 10px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #transcription::before {
    content: '›';
    color: var(--text-dim);
    font-size: 16px;
    flex-shrink: 0;
  }

  #text-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    font-family: var(--font-user);
    font-size: 14px;
    font-weight: 300;
    color: var(--text-user);
    caret-color: var(--text-user);
  }

  #text-input::placeholder { color: var(--text-dim); }

  /* ── state strip ── */
  #state-strip {
    padding: 10px 24px 14px;
    display: flex;
    gap: 22px;
    align-items: center;
  }

  .state-label {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    transition: color 0.3s ease;
  }

  .state-label.live {
    color: var(--state-live);
  }

  .state-label.live::before {
    content: '·';
    margin-right: 5px;
    color: var(--accent-sal);
  }
</style>
</head>
<body>
<div id="app">

  <div id="header">
    <span class="name">Salice</span>
    <span class="subtitle">personal assistant</span>
  </div>

  <div id="conversation"></div>

  <div id="stt-preview"></div>

  <div id="transcription">
    <input id="text-input" type="text" placeholder="type here" autocomplete="off" spellcheck="false">
  </div>

  <div id="state-strip">
    <span id="state-listening"    class="state-label">listening</span>
    <span id="state-transcribing" class="state-label">transcribing</span>
    <span id="state-inference"    class="state-label">inference</span>
    <span id="state-speaking"     class="state-label">speaking</span>
  </div>

</div>
<script>
  const input   = document.getElementById('text-input');
  const conv    = document.getElementById('conversation');
  const preview = document.getElementById('stt-preview');
  const typedPending = new Set();

  const stateEls = {
    listening:    document.getElementById('state-listening'),
    transcribing: document.getElementById('state-transcribing'),
    inference:    document.getElementById('state-inference'),
    speaking:     document.getElementById('state-speaking'),
  };

  function setLive(name) {
    for (const [k, el] of Object.entries(stateEls)) {
      el.classList.toggle('live', k === name);
    }
  }

  function addBubble(cls, speaker, text) {
    const msg = document.createElement('div');
    msg.className = `message ${cls}`;
    const sp = document.createElement('span');
    sp.className = 'speaker';
    sp.textContent = speaker;
    const bub = document.createElement('div');
    bub.className = 'bubble';
    bub.textContent = text;
    msg.appendChild(sp);
    msg.appendChild(bub);
    conv.appendChild(msg);
    conv.scrollTop = conv.scrollHeight;
  }

  input.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    typedPending.add(text);
    addBubble('user', 'you', text);
    fetch('/converse', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text}),
    });
  });

  function connectSSE() {
    const es = new EventSource('/events');

    es.onopen = () => setLive('listening');

    es.onerror = () => setLive(null);

    es.onmessage = e => {
      const {type, text, persona} = JSON.parse(e.data);
      if (type === 'heard') {
        preview.textContent = text;
        preview.classList.remove('corrected');
        setLive('transcribing');
      } else if (type === 'corrected') {
        preview.textContent = text;
        preview.classList.add('corrected');
        setTimeout(() => preview.classList.remove('corrected'), 800);
      } else if (type === 'user_turn') {
        preview.textContent = '';
        setLive('inference');
        if (typedPending.has(text)) {
          typedPending.delete(text);
        } else {
          addBubble('user', 'you', text);
        }
      } else if (type === 'sal_turn') {
        setLive('speaking');
        const name = (!persona || persona === 'default') ? 'Sal' : persona;
        addBubble('sal', name, text);
      } else if (type === 'speak_done') {
        setLive('listening');
      }
    };
  }

  connectSSE();
</script>
</body>
</html>

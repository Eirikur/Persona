<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Persona Chat</title>
<style>
  @font-face {
    font-family: 'Alegreya';
    src: url('fonts/alegreya/Alegreya-Regular.otf') format('opentype');
    font-weight: 400; font-style: normal;
  }
  @font-face {
    font-family: 'Alegreya';
    src: url('fonts/alegreya/Alegreya-Italic.otf') format('opentype');
    font-weight: 400; font-style: italic;
  }
  @font-face {
    font-family: 'Lucida Casual';
    src: url('fonts/lucida-casual.ttf') format('truetype');
    font-weight: 400; font-style: normal;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:           #1E2B35;
    --surface:      #2A3C48;
    --border:       #304454;
    --text-user:    #C4CDD5;
    --text-sal:     #D0D8DF;
    --text-dim:     #4A5A68;
    --text-muted:   #607080;
    --accent-sal:   #b8956a;
    --accent-user:  #5a7a6a;
    --state-live:     #C4CDD5;
    --state-active:   #b8956a;   /* "the LLM's area, in progress" -- tool call, or a reply waiting to be rendered into audio */
    --state-speaking: #5FAD6B;   /* audibly talking, right now */
    --font-sal:     'Alegreya', Georgia, serif;
    --font-user:    'Lucida Casual', 'Lucida Sans', sans-serif;
    --font-ui:      'Lucida Casual', 'Lucida Sans', sans-serif;
    --radius:       10px;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text-user);
    font-family: var(--font-ui);
    font-size: 15px;
    line-height: 1.6;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 760px;
    margin: 0 auto;
    padding: 0 0 0 0;
  }

  /* ── header ── */
  #header {
    padding: 8px 24px 6px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  #header .name {
    font-family: var(--font-sal);
    font-size: 22px;
    color: var(--accent-sal);
    letter-spacing: 0.02em;
  }

  #header .subtitle {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* ── conversation ── */
  #conversation {
    flex: 1;
    overflow-y: auto;
    padding: 24px 24px 12px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .message {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-width: 88%;
  }

  .message.sal { align-self: flex-start; }
  .message.user { align-self: flex-end; }

  .message .speaker {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 0 4px;
  }

  .message.sal .speaker { color: var(--accent-sal); opacity: 0.7; }
  .message.user .speaker { color: var(--accent-user); opacity: 0.7; text-align: right; }

  .message .bubble {
    padding: 11px 16px;
    border-radius: var(--radius);
    line-height: 1.65;
  }

  .message.sal .bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    font-family: var(--font-sal);
    font-size: 26px;
    color: var(--text-sal);
    border-bottom-left-radius: 3px;
  }

  .message.user .bubble {
    background: #253540;
    border: 1px solid #304454;
    font-family: var(--font-user);
    font-size: 20px;
    font-weight: 300;
    color: var(--text-user);
    border-bottom-right-radius: 3px;
  }

  /* ── stt preview ── */
  #stt-preview {
    padding: 6px 24px 2px;
    min-height: 24px;
    font-family: var(--font-user);
    font-size: 12px;
    font-style: italic;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #stt-preview.corrected { color: var(--accent-sal); }

  /* ── input strip ── */
  #transcription {
    padding: 6px 24px 10px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #transcription::before {
    content: '›';
    color: var(--text-dim);
    font-size: 16px;
    flex-shrink: 0;
  }

  #text-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    font-family: var(--font-user);
    font-size: 14px;
    font-weight: 300;
    color: var(--text-user);
    caret-color: var(--text-user);
  }

  #text-input::placeholder { color: var(--text-dim); }

  /* ── state strip ── */
  #state-strip {
    padding: 10px 24px 14px;
    display: flex;
    flex-wrap: wrap;
    row-gap: 6px;
    gap: 16px;
    align-items: center;
  }

  .test-btn {
    margin-left: auto;
    font-family: var(--font-ui);
    font-size: 10px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 2px 8px;
    border-radius: 4px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    transition: all 0.2s ease;
  }

  .test-btn:hover {
    border-color: var(--accent-sal);
    color: var(--accent-sal);
  }

  .state-label {
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    transition: color 0.3s ease;
  }

  .state-label.live {
    color: var(--state-live);
  }

  .state-label.live::before {
    content: '·';
    margin-right: 5px;
    color: var(--accent-sal);
  }

  /* INFERENCE and SPEAKING can run long (a tool call, or Chatterbox
     rendering a reply) -- breathing says "still working," not stuck.
     Scoped to just these two ids: #state-hearing's opacity is driven
     directly by the mic_level handler (see connectSSE), and this must
     not fight that. */
  #state-inference.live,
  #state-speaking.live {
    animation: breathe 2.4s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: 1;    }
    50%      { opacity: 0.35; }
  }

  /* Sub-state color, layered on top of the plain .live color above.
     INFERENCE: white while thinking (the plain .live color), amber while
     a tool call is running. SPEAKING: amber while Chatterbox renders the
     reply (text is ready, no audio yet), green once it's actually playing. */
  #state-inference.live.tool   { color: var(--state-active);   }
  #state-speaking.live.rendering { color: var(--state-active);   }
  #state-speaking.live.playing   { color: var(--state-speaking); }

  /* clicking HEARING mutes voice input; strike-through leaves the label's
     existing color alone so muted state reads as "off" without a new hue */
  #state-hearing {
    cursor: pointer;
    opacity: 1;
    transition: opacity 100ms linear;
  }

  .state-label.muted {
    text-decoration: line-through;
  }

  /* ── tab bar ── */
  #tabbar {
    display: flex;
    padding: 0 24px;
    border-bottom: 1px solid var(--border);
  }

  .tab {
    font-family: var(--font-ui);
    font-size: 9px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-muted);
    padding: 10px 4px;
    margin-right: 20px;
    cursor: pointer;
  }

  .tab:hover  { color: var(--text-user); }
  .tab.active { color: var(--accent-sal); border-bottom-color: var(--accent-sal); }

  /* dot shown on a non-active tab that has new data waiting */
  .tab.has-update::after {
    content: '·';
    color: var(--accent-sal);
    margin-left: 5px;
  }

  /* ── roster: who's present, shown under the tab bar on every tab ── */
  #roster {
    padding: 8px 24px;
    display: flex;
    gap: 14px;
    align-items: center;
    border-bottom: 1px solid var(--border);
  }

  .roster-name {
    font-size: 8px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .roster-name.system { color: var(--text-muted); }

  /* ── panels (chat / logs / settings) ── */
  .panel {
    display: none;
    flex: 1;
    min-height: 0;
    flex-direction: column;
  }

  .panel.active { display: flex; }

  #panel-logs {
    padding: 16px 24px;
    overflow-y: auto;
    font-family: monospace;
    font-size: 12px;
    line-height: 1.7;
    color: var(--text-muted);
    white-space: pre-wrap;
  }

  #panel-settings {
    padding: 22px 24px;
    gap: 18px;
  }

  /* ── test panel ── */
  #panel-test {
    padding: 22px 24px;
    gap: 14px;
  }

  #panel-test .test-description {
    font-size: 13px;
    color: var(--text-muted);
  }

  #panel-test .test-btn {
    margin-left: 0;
    align-self: flex-start;
  }

  .setting-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .setting-row label {
    width: 70px;
    flex-shrink: 0;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
  }

  .setting-row select,
  .setting-row input[type="text"] {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-user);
    font-family: var(--font-ui);
    font-size: 13px;
    padding: 6px 10px;
    border-radius: 6px;
    outline: none;
  }
</style>
</head>
<body>
<div id="app">

  <div id="header">
    <span class="name">Persona</span>
    <span class="subtitle">AI Habitat</span>
  </div>

  <div id="tabbar">
    <button class="tab active" data-tab="chat">Chat</button>
    <button class="tab" data-tab="logs">Logs</button>
    <button class="tab" data-tab="settings">Settings</button>
    <button class="tab" data-tab="test">Test</button>
  </div>

  <div id="roster">
    <span class="roster-name system">system</span>
  </div>

  <div id="panel-chat" class="panel active">

    <div id="conversation"></div>

    <div id="stt-preview"></div>

    <div id="transcription">
      <input id="text-input" type="text" placeholder="type here" autocomplete="off" spellcheck="false">
    </div>

    <div id="state-strip">
      <span id="state-hearing"      class="state-label">hearing</span>
      <span id="state-transcribing" class="state-label">transcribing</span>
      <span id="state-inference"    class="state-label">inference</span>
      <span id="state-speaking"     class="state-label">speaking</span>
    </div>

  </div>

  <div id="panel-logs" class="panel">
  </div>

  <div id="panel-test" class="panel">
    <p class="test-description">Fires a canned test message through the pipeline, the same as a real utterance.</p>
    <button id="test-btn" class="test-btn">Run test</button>
  </div>

  <div id="panel-settings" class="panel">

    <div class="setting-row">
      <label for="setting-mode">mode</label>
      <select id="setting-mode">
        <option value="named">named (wake word required)</option>
        <option value="open">open (always listening)</option>
      </select>
    </div>

    <div class="setting-row">
      <label for="setting-provider">provider</label>
      <select id="setting-provider">
        <option value="ollama">ollama</option>
        <option value="openai">openai</option>
        <option value="cerebras">cerebras</option>
        <option value="perplexity">perplexity</option>
        <option value="openrouter">openrouter</option>
        <option value="echo">echo (no LLM, for testing)</option>
      </select>
    </div>

    <div class="setting-row">
      <label for="setting-model">model</label>
      <input id="setting-model" type="text" placeholder="default for provider">
      <button id="setting-model-apply" class="test-btn">Apply</button>
    </div>

  </div>

</div>
<script>
  const input   = document.getElementById('text-input');
  const conv    = document.getElementById('conversation');
  const preview = document.getElementById('stt-preview');
  const testBtn = document.getElementById('test-btn');
  const typedPending = new Set();

  // HEARING is the pipeline's base/idle state (lit like the others below
  // when nothing else is happening) and it also doubles as the mute toggle:
  // click it to stop the hub from acting on voice input during smoke tests.
  const hearingEl = document.getElementById('state-hearing');

  const stateEls = {
    hearing:      hearingEl,
    transcribing: document.getElementById('state-transcribing'),
    inference:    document.getElementById('state-inference'),
    speaking:     document.getElementById('state-speaking'),
  };

  hearingEl.addEventListener('click', () => {
    const muted = !hearingEl.classList.contains('muted');
    hearingEl.classList.toggle('muted', muted);
    fetch(`/mute/${muted ? 'on' : 'off'}`, {method: 'POST'});
  });

  let currentState = null;
  let minEndTime = 0;
  let statePromise = Promise.resolve();

  function setLive(name) {
    console.log(`setLive requested: ${name} (current: ${currentState}, minEndTime: ${minEndTime})`);
    statePromise = statePromise.then(async () => {
      if (name === currentState) {
        console.log(`setLive: ${name} is already current, skipping`);
        return;
      }

      if (Date.now() < minEndTime) {
        const wait = minEndTime - Date.now();
        console.log(`setLive: waiting ${wait}ms before transitioning to ${name}`);
        await new Promise(resolve => setTimeout(resolve, wait));
      }

      for (const [k, el] of Object.entries(stateEls)) {
        el.classList.toggle('live', k === name);
      }
      currentState = name;
      console.log(`setLive: transitioned to ${name}`);

      if (name === 'transcribing' || name === 'inference') {
        minEndTime = Date.now() + 2000;
      } else {
        minEndTime = 0;
      }
    });
  }

  function addBubble(cls, speaker, text) {
    const msg = document.createElement('div');
    msg.className = `message ${cls}`;
    const sp = document.createElement('span');
    sp.className = 'speaker';
    sp.textContent = speaker;
    const bub = document.createElement('div');
    bub.className = 'bubble';
    bub.textContent = text;
    msg.appendChild(sp);
    msg.appendChild(bub);
    conv.appendChild(msg);
    conv.scrollTop = conv.scrollHeight;
  }

  // Persona keys are internal ("default"); this is the one place that
  // maps a key to what the user should actually see.
  function personaDisplayName(name) {
    return (!name || name === 'default') ? 'Sal' : name;
  }

  input.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    typedPending.add(text);
    addBubble('user', 'you', text);
    fetch('/converse', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text, typed: true}),
    });
  });

  // ── tab switching ──
  const tabs    = document.querySelectorAll('.tab');
  const tabByName = {};
  tabs.forEach(t => { tabByName[t.dataset.tab] = t; });

  const panels = {
    chat:     document.getElementById('panel-chat'),
    logs:     document.getElementById('panel-logs'),
    test:     document.getElementById('panel-test'),
    settings: document.getElementById('panel-settings'),
  };

  // The OS/taskbar window title tracks whichever tab is showing, so the
  // window is identifiable from outside the app (alt-tab, taskbar).
  const TAB_TITLES = {
    chat:     'Persona Chat',
    logs:     'Persona Logs',
    test:     'Persona Test',
    settings: 'Persona Settings',
  };

  function activeTabName() {
    return document.querySelector('.tab.active')?.dataset.tab;
  }

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.toggle('active', t === tab));
      tab.classList.remove('has-update');
      for (const [name, panel] of Object.entries(panels)) {
        panel.classList.toggle('active', name === tab.dataset.tab);
      }
      document.title = TAB_TITLES[tab.dataset.tab];
      if (tab.dataset.tab === 'settings') loadSettings();
    });
  });

  // ── logs panel: every SSE event, shown as a plain scrolling list ──
  const logPanel     = document.getElementById('panel-logs');
  const logLines      = [];
  const MAX_LOG_LINES = 200;

  function addLogLine(type, detail) {
    const time = new Date().toLocaleTimeString();
    logLines.push(`${time}  ${type}${detail ? '  ' + detail : ''}`);
    if (logLines.length > MAX_LOG_LINES) logLines.shift();
    logPanel.textContent = logLines.join('\n');
    logPanel.scrollTop = logPanel.scrollHeight;
    if (activeTabName() !== 'logs') tabByName.logs.classList.add('has-update');
  }

  // ── settings panel ──
  const modeSelect     = document.getElementById('setting-mode');
  const providerSelect = document.getElementById('setting-provider');
  const modelInput     = document.getElementById('setting-model');
  const modelApplyBtn  = document.getElementById('setting-model-apply');

  function loadSettings() {
    fetch('/state')
      .then(r => r.json())
      .then(s => {
        modeSelect.value     = s.mode;
        providerSelect.value = s.provider;
        modelInput.value     = s.model || '';
      });
  }

  modeSelect.addEventListener('change', () => {
    fetch(`/mode/${modeSelect.value}`, {method: 'POST'});
  });

  providerSelect.addEventListener('change', () => {
    fetch(`/provider/${providerSelect.value}`, {method: 'POST'});
  });

  modelApplyBtn.addEventListener('click', () => {
    fetch(`/model/${encodeURIComponent(modelInput.value)}`, {method: 'POST'});
  });

  // ── roster: who's present, fetched once at load ──
  const rosterEl = document.getElementById('roster');

  function loadRoster() {
    fetch('/state')
      .then(r => r.json())
      .then(s => {
        for (const name of s.loaded_personas || []) {
          const el = document.createElement('span');
          el.className = 'roster-name';
          el.textContent = personaDisplayName(name);
          rosterEl.appendChild(el);
        }
        hearingEl.classList.toggle('muted', !!s.muted);
      });
  }
  loadRoster();

  function connectSSE() {
    const es = new EventSource('/events');

    es.onopen = () => setLive('hearing');

    es.onerror = () => setLive(null);

    es.onmessage = e => {
      const data = JSON.parse(e.data);
      const {type, text, persona, level, speaker} = data;

      // Fires ~10x/second while the mic is open -- handled separately so it
      // doesn't flood the log panel or the console. Inverted on purpose: at
      // rest HEARING matches the other idle labels' brightness, and it dims
      // as mic activity rises rather than the other way around.
      if (type === 'mic_level') {
        hearingEl.style.opacity = (1 - 0.7 * level).toFixed(2);
        return;
      }

      console.log(`SSE Event: ${data.type} -> ${JSON.stringify(data)}`);
      addLogLine(type, text || persona || '');
      if (type === 'heard') {
        preview.textContent = text;
        preview.classList.remove('corrected');
        setLive('transcribing');
      } else if (type === 'corrected') {
        preview.textContent = text;
        preview.classList.add('corrected');
        setTimeout(() => preview.classList.remove('corrected'), 800);
      } else if (type === 'user_turn') {
        preview.textContent = '';
        if (typedPending.has(text)) {
          typedPending.delete(text);
        } else {
          addBubble('user', speaker || 'you', text);
        }
      } else if (type === 'inference') {
        stateEls.inference.classList.remove('tool');
        setLive('inference');
      } else if (type === 'tool_call') {
        // A tool call can start after INFERENCE is already showing (or,
        // rarely, before the queued setLive('inference') above has applied
        // it) -- adding the modifier class either way is harmless, since
        // it only paints once .live is actually on the element.
        stateEls.inference.classList.add('tool');
      } else if (type === 'sal_turn') {
        stateEls.speaking.classList.add('rendering');
        stateEls.speaking.classList.remove('playing');
        setLive('speaking');
        addBubble('sal', personaDisplayName(persona), text);
      } else if (type === 'playback_start') {
        stateEls.speaking.classList.remove('rendering');
        stateEls.speaking.classList.add('playing');
      } else if (type === 'speak_done') {
        stateEls.inference.classList.remove('tool');
        stateEls.speaking.classList.remove('rendering', 'playing');
        setLive('hearing');
      }
    };
  }
  connectSSE();

  testBtn.addEventListener('click', () => {
    fetch('/trigger_test', {method: 'POST'})
      .then(r => r.json())
      .then(data => console.log('Test trigger:', data))
      .catch(e => console.error('Test trigger error:', e));
  });

  // A throwaway tool (persona_screenshot.sh) loads this same page with
  // ?no_shutdown=1 so that closing its tab can't take down the real hub.
  const skipShutdown = new URLSearchParams(location.search).has('no_shutdown');

  window.addEventListener('unload', () => {
    if (!skipShutdown) navigator.sendBeacon('/shutdown');
  });
</script>
</body>
</html>
